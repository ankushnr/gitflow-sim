name: CI
on:
  push:
    branches: [main, develop, "release/**", "hotfix/**", "feature/**"]
  pull_request:
    branches: [main, develop]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest flake8
      - run: flake8 --max-line-length=100 .
      - run: pytest -q
